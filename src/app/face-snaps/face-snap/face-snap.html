<article class="face-snap-card">
  <img [src]="faceSnap.imageUrl" [alt]="faceSnap.title" loading="lazy" />
  <div class="card-content">
    <h2>{{ faceSnap.title }}</h2>
    <p>{{ faceSnap.description }}</p>
    <button type="button" (click)="onViewFaceSnap()">
      Découvrir <span class="sr-only">{{ faceSnap.title }}</span
      ><span aria-hidden="true">→</span>
    </button>
  </div>
</article>
